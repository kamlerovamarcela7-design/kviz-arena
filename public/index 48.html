<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🏆 KVÍZ ARÉNA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10132b;color:#fff;font:16px system-ui,Arial}main{max-width:640px;margin:auto;padding:12px 12px 100px}h1{font-size:26px;margin:5px 0}h2{font-size:20px;margin:8px 0}p{margin:9px 0;color:#c9cbe3}.panel{background:#1c2143;border:1px solid #39416b;border-radius:16px;padding:14px;margin:10px 0}.hidden{display:none!important}.btn{border:0;border-radius:12px;background:#7867ff;color:white;font:inherit;font-weight:750;padding:12px;cursor:pointer;width:100%;margin:4px 0}.btn:disabled{opacity:.45}.alt{background:#39446d}.good{background:#138566}.bad{background:#8d3d59}input,select{width:100%;padding:11px;margin:5px 0 10px;background:#111633;color:white;border:1px solid #58628d;border-radius:10px;font:inherit}label{color:#c9cbe3;font-size:14px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{background:#343d78;min-height:68px;line-height:1.25;overflow-wrap:anywhere}.answer.correct{background:#138566}.answer.wrong{background:#753044}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{display:inline-block;background:#344079;border-radius:18px;padding:5px 10px;font-size:13px}.big{font-size:32px;color:#f8d66e;font-weight:900;letter-spacing:3px}.score{display:flex;justify-content:space-between;border-bottom:1px solid #39416b;padding:8px 0}.status{color:#f8d66e;min-height:22px;font-size:14px}.quick{position:fixed;bottom:0;left:0;right:0;background:#10132bf5;border-top:1px solid #39416b;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:3}.quick>div{max-width:616px;margin:auto}.quick .btn{margin:0}.compact{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.compact button{font-size:13px;padding:10px 5px}.info{font-size:13px;color:#b9c1dd}.row{display:flex;gap:8px}.row>*{flex:1}#question{font-size:clamp(19px,5vw,25px);margin:12px 0}#questionImage{max-height:175px;max-width:100%;object-fit:contain;border-radius:12px;display:block;margin:8px auto}#finish{border:2px solid #f8d66e;text-align:center}#finish h2{font-size:27px}#confetti{font-size:26px;letter-spacing:7px}details summary{cursor:pointer;font-weight:700;padding:7px 0}#questionPanel{scroll-margin-top:8px}@media(max-width:350px){.answer{font-size:14px;padding:9px}.panel{padding:10px}}
</style></head><body><main><h1>🏆 KVÍZ ARÉNA</h1><p class="info">První správná odpověď vyhrává. Bez časovače.</p>
<section id="home" class="panel"><h2>🎤 Založit hru</h2><label>Obtížnost</label><select id="difficulty"><option>Lehká</option><option selected>Střední</option><option>Těžká</option></select><label>Počet otázek</label><select id="limit"><option value="20">20 otázek</option><option value="30">30 otázek</option><option value="40">40 otázek</option></select><button class="btn good" onclick="create()">🏆 Založit místnost</button><hr><h2>🎮 Připojit se</h2><label>Kód místnosti</label><input id="code" inputmode="numeric" maxlength="6" placeholder="Např. 123456"><label>Přezdívka</label><input id="name" maxlength="40" placeholder="Např. Adam"><button class="btn" onclick="join()">Připojit se</button></section>
<section id="game" class="hidden"><div id="finish" class="panel hidden"><div id="confetti">🎊🎉🏆🎉🎊</div><h2>🏆 KONEC HRY</h2><p id="champion"></p><div id="finalScores"></div><button class="btn good hostOnly hidden" onclick="resetGame()">🎮 Další hra – nové otázky</button></div>
<div id="questionPanel" class="panel"><div class="top"><span class="tag" id="category">Čekání</span><span class="tag" id="progress">0 / 20</span></div><h2 id="question">Čekáme na první otázku…</h2><img id="questionImage" class="hidden" alt="Obrázková otázka"><div id="answers" class="answers"></div><p id="result"></p></div>
<div class="panel"><div class="top"><span class="tag" id="role">Hráč</span><strong id="roomCode" class="big"></strong></div><div class="info">Kód místnosti pro pozvání dalších hráčů</div><div id="invites" class="hostOnly hidden"><div class="compact"><button class="btn good" onclick="inviteWhatsApp()">WhatsApp</button><button class="btn alt" onclick="inviteSMS()">SMS</button><button class="btn alt" onclick="inviteOther()">Sdílet</button></div></div></div>
<div id="hostControls" class="panel hidden"><div id="playSetup"><label>Tvoje přezdívka (chceš-li také soutěžit)</label><input id="hostName" maxlength="40" placeholder="Např. Marcela"><button class="btn good" onclick="hostPlay()">🎮 Také hraju</button></div><p id="playActive" class="hidden">✅ Soutěžíš spolu s ostatními.</p><button id="reveal" class="btn alt" onclick="send('reveal')">⏹ Ukončit otázku bez bodu</button><details><summary>✏️ Přidat vlastní otázku do další hry</summary><input id="customText" placeholder="Text otázky"><div id="optionInputs"></div><label>Správná odpověď</label><select id="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><button class="btn alt" onclick="addQuestion()">Přidat otázku</button></details></div>
<div class="panel"><h2>🏅 Žebříček</h2><div id="scores"></div></div></section><p id="status" class="status" role="status"></p></main>
<div id="quick" class="quick hidden"><div><button id="next" class="btn good" onclick="startNext()">▶ Spustit další otázku</button></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),letters=['A','B','C','D'];let role='',room='',token='',hostPlaying=false,lastId='',wrong=new Set(),answered=false,current=null;
$('optionInputs').innerHTML=letters.map((l,i)=>`<label>Odpověď ${l}</label><input id="o${i}" maxlength="80" placeholder="Možnost ${l}">`).join('');
const params=new URLSearchParams(location.search);if(params.get('room'))$('code').value=params.get('room');
function message(t){$('status').textContent=t;}
function send(ev,data={}){socket.emit(ev,data,res=>{if(res?.error)message(res.error);else if(ev==='addQuestion'){message('Otázka přidána do příští hry.');$('customText').value='';letters.forEach((_,i)=>$('o'+i).value='');}});}
function create(){socket.emit('create',{difficulty:$('difficulty').value,limit:Number($('limit').value)},res=>{if(res?.error)return message(res.error);role='host';room=res.code;sessionStorage.setItem('arena_host',JSON.stringify({code:room,hostToken:res.hostToken}));show();socket.emit('resumeHost',{code:room,hostToken:res.hostToken});});}
function join(){const code=$('code').value.trim(),name=$('name').value.trim();socket.emit('join',{code,name,token:sessionStorage.getItem('quiz_'+code)||''},res=>{if(res?.error)return message(res.error);role='player';room=code;token=res.token;sessionStorage.setItem('quiz_'+code,token);sessionStorage.setItem('arena_player',JSON.stringify({code,name,token}));show();});}
function show(){$('home').classList.add('hidden');$('game').classList.remove('hidden');$('hostControls').classList.toggle('hidden',role!=='host');$('quick').classList.toggle('hidden',role!=='host');document.querySelectorAll('.hostOnly').forEach(el=>el.classList.toggle('hidden',role!=='host'));$('role').textContent=role==='host'?'🎤 Moderátorka':'🎮 Hráč';$('roomCode').textContent=room;history.replaceState(null,'',role==='host'?'/?host='+room:'/?room='+room);message('Připojeno.');}
function inviteLink(){return location.origin+'/?room='+encodeURIComponent(room)}function inviteText(){return 'Přidej se do mojí KVÍZ ARÉNY! 🏆 Kód: '+room+'\n'+inviteLink()}
function inviteWhatsApp(){location.href='https://wa.me/?text='+encodeURIComponent(inviteText())}function inviteSMS(){location.href='sms:?body='+encodeURIComponent(inviteText())}
async function inviteOther(){try{if(navigator.share)await navigator.share({title:'KVÍZ ARÉNA',text:inviteText(),url:inviteLink()});else{await navigator.clipboard.writeText(inviteText());message('Pozvánka zkopírována.')}}catch(e){if(e.name!=='AbortError')message('Sdílení se nepodařilo.')}}
function hostPlay(){socket.emit('hostPlay',{name:$('hostName').value.trim()},res=>{if(res?.error)message(res.error);else message('Hraješ také!')});}
function startNext(){if(!socket.connected)return message('Čekám na server.');send('next');$('questionPanel').scrollIntoView({block:'start'});}
function resetGame(){if(confirm('Začít novou hru a vynulovat body?'))send('reset');}
function addQuestion(){send('addQuestion',{text:$('customText').value,options:letters.map((_,i)=>$('o'+i).value),correct:Number($('correct').value)});}
function answer(i){if(wrong.has(i)||answered||current?.phase!=='question')return;wrong.add(i);renderAnswers(current);socket.emit('answer',i,res=>{if(res?.error){message(res.error);return;}if(res.correct){answered=true;message('Správně! +'+res.points+' bod'+(res.points===1?'':'y')+'.')}else message('Nesprávně. Zkus jinou možnost.');renderAnswers(current);});}
function renderAnswers(s){$('answers').replaceChildren();if(!s?.question)return;s.question.options.forEach((v,i)=>{const b=document.createElement('button');b.className='btn answer';b.textContent=letters[i]+'. '+v;b.disabled=!(role==='player'||role==='host'&&hostPlaying)||s.phase!=='question'||answered||wrong.has(i);if(wrong.has(i))b.classList.add('wrong');if(['result','finished'].includes(s.phase)&&s.answer===i)b.classList.add('correct');b.onclick=()=>answer(i);$('answers').appendChild(b);});}
function medals(players){let last=null,rank=0;return players.map((p,i)=>{if(p.score!==last){rank=i+1;last=p.score;}const medal=rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'🏅';const row=document.createElement('div');row.className='score';const name=document.createElement('span');name.textContent=medal+' '+p.name+(p.connected?'':' (offline)');const score=document.createElement('strong');score.textContent=p.score+' b.';row.append(name,score);return row;});}
socket.on('state',s=>{if(!room||s.code!==room)return;current=s;hostPlaying=!!s.hostPlaying;if(role==='host'){$('playSetup').classList.toggle('hidden',hostPlaying);$('playActive').classList.toggle('hidden',!hostPlaying);}const id=s.question?.id||'';if(id!==lastId){lastId=id;wrong=new Set();answered=false;message('');}const finished=s.phase==='finished';$('finish').classList.toggle('hidden',!finished);$('questionPanel').classList.toggle('hidden',finished);$('progress').textContent=s.used+' / '+s.total;$('category').textContent=(s.question?.category||'Čekání')+(s.question?.bonus?' ⭐ BONUS ×2':'');$('question').textContent=s.question?.text||'Moderátorka připravuje otázku…';$('questionImage').classList.toggle('hidden',!s.question?.image);if(s.question?.image)$('questionImage').src=s.question.image;renderAnswers(s);$('result').textContent=s.phase==='result'?(s.winner?'🏆 '+s.winner.name+' získává '+s.winner.points+' b.!':'Bez bodu. Správná odpověď je zeleně.'):s.phase==='question'?'⚡ Kdo odpoví správně jako první?':'Čekáme na další otázku.';$('scores').replaceChildren(...medals(s.players));if(!s.players.length)$('scores').textContent='Zatím žádní hráči.';$('finalScores').replaceChildren(...medals(s.players));const max=s.players[0]?.score;$('champion').textContent=s.players.length?'Vítěz: '+s.players.filter(p=>p.score===max).map(p=>p.name).join(' a ')+' ('+max+' b.)':'Hra skončila.';$('next').disabled=finished||s.phase==='question';$('next').textContent=s.phase==='lobby'?'▶ Spustit první otázku':'▶ Další otázka';$('quick').classList.toggle('hidden',role!=='host'||finished);$('reveal').disabled=s.phase!=='question';});
socket.on('notice',message);
function reconnect(){if(!room)return;if(role==='host'){const saved=JSON.parse(sessionStorage.getItem('arena_host')||'null');if(saved?.code===room)socket.emit('resumeHost',saved,res=>{if(res?.error)message(res.error)});}else{const saved=JSON.parse(sessionStorage.getItem('arena_player')||'null');if(saved?.code===room)socket.emit('join',saved,res=>{if(res?.error)message(res.error)});}}
socket.on('connect',reconnect);
function restore(){const h=JSON.parse(sessionStorage.getItem('arena_host')||'null'),p=JSON.parse(sessionStorage.getItem('arena_player')||'null');if(h?.code&&h.hostToken&&(!params.get('room')||params.get('host')===h.code)){role='host';room=h.code;show();if(socket.connected)reconnect();}else if(p?.code&&p.token&&(!params.get('room')||params.get('room')===p.code)){role='player';room=p.code;token=p.token;$('name').value=p.name;show();if(socket.connected)reconnect();}}
restore();
</script></body></html>
